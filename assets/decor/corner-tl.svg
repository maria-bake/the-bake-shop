<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 420" width="420" height="420" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="cTlWash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDF1F6" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FDF1F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FDF1F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cTlPetalFill" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#F7C9DA"/>
      <stop offset="0.30" stop-color="#FBE0EA"/>
      <stop offset="0.72" stop-color="#FDF1F6"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="cTlPetalShade" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#F7C9DA" stop-opacity="0.04"/>
      <stop offset="0.62" stop-color="#F7C9DA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F7C9DA" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="cTlPetalLight" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>

    <linearGradient id="cTlBudFill" x1="0.5" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#F7C9DA"/>
      <stop offset="0.6" stop-color="#FBE0EA"/>
      <stop offset="1" stop-color="#FDF1F6"/>
    </linearGradient>

    <!-- one lily petal: crisp silhouette, folded centre crease, tapering tip -->
    <g id="cTlPetalUnit">
      <path d="M0 0 C-14 -20 -26 -55 -22 -92 C-19 -118 -9 -141 2 -152 C11 -138 20 -116 23 -90 C27 -53 13 -22 0 0 Z" fill="url(#cTlPetalFill)"/>
      <path d="M0 0 C-14 -20 -26 -55 -22 -92 C-19 -118 -9 -141 2 -152 C0 -108 -1 -50 0 0 Z" fill="url(#cTlPetalShade)"/>
      <path d="M2 -152 C11 -138 20 -116 23 -90 C27 -53 13 -22 0 0 C1 -50 2 -108 2 -152 Z" fill="url(#cTlPetalLight)"/>
      <path d="M0 -4 C1 -44 2 -88 2 -145" fill="none" stroke="#F7C9DA" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M-1 -24 C-8 -44 -13 -64 -14 -86" fill="none" stroke="#F7C9DA" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
      <path d="M1 -32 C8 -52 14 -72 16 -94" fill="none" stroke="#F7C9DA" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
      <g fill="#E39BB8" opacity="0.28">
        <ellipse cx="-6" cy="-26" rx="1.9" ry="1.3"/>
        <ellipse cx="5" cy="-34" rx="1.7" ry="1.2"/>
        <ellipse cx="-4" cy="-46" rx="1.5" ry="1.1"/>
        <ellipse cx="8" cy="-56" rx="1.3" ry="0.95"/>
        <ellipse cx="-8" cy="-64" rx="1.2" ry="0.9"/>
        <ellipse cx="3" cy="-76" rx="1" ry="0.8"/>
      </g>
    </g>

    <g id="cTlStamen">
      <path d="M0 0 C22 8 44 22 60 44" fill="none" stroke="#E39BB8" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="61" cy="46" rx="5.2" ry="2.5" transform="rotate(56 61 46)" fill="#C96E92" opacity="0.42"/>
    </g>
  </defs>

  <!-- airy washes -->
  <ellipse cx="66" cy="52" rx="196" ry="178" fill="url(#cTlWash)"/>
  <ellipse cx="24" cy="252" rx="104" ry="96" fill="url(#cTlWash)" opacity="0.7"/>

  <!-- fine stems -->
  <path d="M0 128 C34 140 68 162 92 194" fill="none" stroke="#F7C9DA" stroke-width="1.3" stroke-linecap="round" opacity="0.34"/>
  <path d="M132 0 C144 24 150 48 148 74" fill="none" stroke="#F7C9DA" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- partial lily anchored to the corner, bleeding off top and left -->
  <g>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(240) scale(0.7)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(15) scale(0.64)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(190) scale(0.8)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(46) scale(0.76)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(84) scale(0.88)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(148) scale(0.95)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(52 46) rotate(112) scale(1.02)"/>

    <use xlink:href="#cTlStamen" href="#cTlStamen" transform="translate(52 46) rotate(2) scale(1.15)"/>
    <use xlink:href="#cTlStamen" href="#cTlStamen" transform="translate(52 46) rotate(24) scale(0.95)"/>
    <use xlink:href="#cTlStamen" href="#cTlStamen" transform="translate(52 46) rotate(-16) scale(0.8)"/>
    <circle cx="52" cy="46" r="6" fill="#FBE0EA"/>
    <circle cx="51" cy="44" r="3" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- small secondary spill down the left edge -->
  <g>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(8 216) rotate(104) scale(0.56)"/>
    <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(8 216) rotate(146) scale(0.48)"/>
    <path d="M8 216 C26 224 42 236 52 252" fill="none" stroke="#F7C9DA" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- a bud and one loose drifting petal -->
  <g transform="translate(186 214) rotate(28)">
    <path d="M0 0 C-11 -6 -17 -20 -15 -34 C-13 -48 -5 -57 1 -60 C8 -55 15 -44 16 -30 C17 -16 10 -4 0 0 Z" fill="url(#cTlBudFill)"/>
    <path d="M0 0 C-11 -6 -17 -20 -15 -34 C-13 -48 -5 -57 1 -60 C-1 -40 -1 -18 0 0 Z" fill="#F7C9DA" opacity="0.3"/>
    <path d="M0 -3 C1 -20 1 -40 1 -56" fill="none" stroke="#F7C9DA" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <path d="M0 0 C2 12 6 20 13 27" fill="none" stroke="#F7C9DA" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(258 96) rotate(58) scale(0.3)"/>
  <use xlink:href="#cTlPetalUnit" href="#cTlPetalUnit" transform="translate(118 300) rotate(196) scale(0.26)"/>
</svg>
